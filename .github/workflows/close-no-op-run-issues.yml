---
name: Close No-Op Run Issues

"on":
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  close-no-op-run:
    if: github.event.issue.title == '[aw] No-Op Runs'
    runs-on: ubuntu-latest
    steps:
      - name: Close No-Op run issue
        # v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
