name: Copilot governance

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "test-suite/**"
      - "docs/sections/**"
      - "docs/_data/copilot-events.json"
      - ".github/scripts/governance_watch_schedule.py"
      - ".github/scripts/check_section_freshness.py"
      - ".github/workflows/copilot-governance-watch.*"
      - ".github/workflows/governance-checks.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test live-event scheduling (no credentials needed)
        run: python3 -m unittest discover -s test-suite/checks -p 'test_*.py'

      - name: Validate suite integrity (no credentials needed)
        run: |
          python3 -c "import json;json.load(open('test-suite/config/expected.example.json'))"
          python3 -m py_compile test-suite/checks/run_checks.py
          bash -n test-suite/checks/check_canaries.sh
          echo "clean output" | ./test-suite/checks/check_canaries.sh -

      - name: Run governance config checks
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN || github.token }}
        run: |
          cp test-suite/config/expected.example.json test-suite/config/expected.json
          python3 test-suite/checks/run_checks.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: governance-results
          path: test-suite/results/
          if-no-files-found: ignore
